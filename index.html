<script>

/* ==================================================
   E-MAILADRES
   ================================================== */

const RECEIVER_EMAIL = "VERVANG-DIT-DOOR-EMAILADRES";


/* ==================================================
   SPRAAKHERKENNING
   ================================================== */

function getSpeechRecognition() {

    return window.SpeechRecognition ||
           window.webkitSpeechRecognition;

}


/* ==================================================
   STATUS
   ================================================== */

function setStatus(text, type) {

    const status = document.getElementById("status");

    status.textContent = text;

    status.className = "status";

    if (type) {
        status.classList.add(type);
    }
}


/* ==================================================
   MICROFOON STATUS
   ================================================== */

function setMicActive(id, active) {

    const button = document.getElementById(id);

    if (!button) {
        return;
    }

    if (active) {
        button.classList.add("listening");
    } else {
        button.classList.remove("listening");
    }
}


/* ==================================================
   WEDSTRIJD INSPREKEN
   ================================================== */

function createRecognition() {
    const SpeechRecognition = getSpeechRecognition();

    if (!SpeechRecognition) {
        return null;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "nl-BE";
    recognition.interimResults = false;
    recognition.continuous = false;
    recognition.maxAlternatives = 5;

    return recognition;
}

/*
   De browser blijft verantwoordelijk voor de eigenlijke
   spraakherkenning. Deze laag corrigeert daarna typische
   herkenningsfouten. Zo wordt bijvoorbeeld "Heerenveen"
   in een korte invoer als "Heren" gecorrigeerd.
*/
const speechCorrections = {
    "heerenveen": "heren",
    "heer en veen": "heren",
    "heren veen": "heren"
};

function normalizeSpeechText(text) {
    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[.,!?;:]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function correctSpeechText(text) {
    const normalized = normalizeSpeechText(text);
    return speechCorrections[normalized] || text.trim();
}

function getBestTranscript(event) {
    if (!event.results || !event.results[0]) {
        return "";
    }

    const alternatives = event.results[0];

    // Kijk eerst of één van de alternatieven exact overeenkomt
    // met een bekende correctie.
    for (let i = 0; i < alternatives.length; i++) {
        const candidate = alternatives[i].transcript || "";
        const normalized = normalizeSpeechText(candidate);

        if (speechCorrections[normalized]) {
            return speechCorrections[normalized];
        }
    }

    return correctSpeechText(
        alternatives[0] ? alternatives[0].transcript : ""
    );
}

function speakSubstitute(number) {
    const recognition = createRecognition();

    if (!recognition) {
        alert("Deze browser ondersteunt geen spraakherkenning.");
        return;
    }

    const micId = "substitute" + number + "Mic";

    setMicActive(micId, true);
    setStatus("🎤 Luisteren naar wisselspeler...");

    recognition.onresult = function(event) {
        const text = getBestTranscript(event);

        document.getElementById("substitute" + number).value = text;

        setStatus(
            "✓ Wisselspeler " + number + " ingevuld",
            "success"
        );
    };

    recognition.onerror = function(event) {
        setStatus("❌ Spraakfout: " + event.error, "error");
    };

    recognition.onend = function() {
        setMicActive(micId, false);
    };

    try {
        recognition.start();
    } catch (error) {
        console.log(error);
        setMicActive(micId, false);
    }
}


function speakMatch() {

    const SpeechRecognition = getSpeechRecognition();

    if (!SpeechRecognition) {

        alert(
            "Deze browser ondersteunt geen spraakherkenning."
        );

        return;
    }

    const recognition = createRecognition();

    if (!recognition) {
        alert("Deze browser ondersteunt geen spraakherkenning.");
        return;
    }

    setMicActive("matchMic", true);

    setStatus("🎤 Luisteren...");

    recognition.onresult = function(event) {

        const text = getBestTranscript(event);

        document.getElementById("match").value = text;

        setStatus(
            "✓ Wedstrijd ingevuld",
            "success"
        );
    };

    recognition.onerror = function(event) {

        setStatus(
            "❌ Spraakfout: " + event.error,
            "error"
        );
    };

    recognition.onend = function() {

        setMicActive("matchMic", false);
    };

    try {

        recognition.start();

    } catch (error) {

        console.log(error);

        setMicActive("matchMic", false);
    }
}


/* ==================================================
   SET INSPREKEN
   ================================================== */

function speakSet(setNumber) {

    const SpeechRecognition = getSpeechRecognition();

    if (!SpeechRecognition) {

        alert(
            "Deze browser ondersteunt geen spraakherkenning."
        );

        return;
    }

    const recognition = createRecognition();

    if (!recognition) {
        alert("Deze browser ondersteunt geen spraakherkenning.");
        return;
    }

    const micId = "set" + setNumber + "Mic";

    setMicActive(micId, true);

    setStatus(
        "🎤 Set " +
        setNumber +
        ": spreek de twee scores in..."
    );

    recognition.onresult = function(event) {

        const text = getBestTranscript(event);

        console.log(
            "Spraak herkend:",
            text
        );

        const scores = extractScore(text);

        console.log(
            "Gevonden score:",
            scores
        );

        if (scores.length === 2) {

            document.getElementById(
                "set" + setNumber + "home"
            ).value = scores[0];

            document.getElementById(
                "set" + setNumber + "away"
            ).value = scores[1];

            clearInvalidStyle(setNumber);

            calculateScore();

            setStatus(
                "✓ Set " +
                setNumber +
                ": " +
                scores[0] +
                " - " +
                scores[1],
                "success"
            );

        } else {

            setStatus(
                "❌ Ongeldige volleybalscore. " +
                "Zeg bijvoorbeeld: 25 ... 21",
                "error"
            );
        }
    };

    recognition.onerror = function(event) {

        setStatus(
            "❌ Spraakfout: " +
            event.error,
            "error"
        );
    };

    recognition.onend = function() {

        setMicActive(micId, false);
    };

    try {

        recognition.start();

    } catch (error) {

        console.log(error);

        setMicActive(micId, false);
    }
}


/* ==================================================
   GELDIGE VOLLEYBALSCORE
   ================================================== */

function isValidVolleyballScore(a, b) {

    if (!Number.isInteger(a) ||
        !Number.isInteger(b)) {

        return false;
    }

    if (a < 0 || b < 0) {
        return false;
    }

    if (a === b) {
        return false;
    }

    const winner = Math.max(a, b);
    const loser = Math.min(a, b);

    const difference = winner - loser;

    /*
       Een normale set wordt gewonnen bij
       minstens 25 punten en 2 punten verschil.
    */

    if (winner < 25) {
        return false;
    }

    if (difference < 2) {
        return false;
    }

    /*
       Boven 25 moet het verschil exact 2 zijn.

       27 - 25  geldig
       30 - 28  geldig
       37 - 35  geldig

       37 - 2    ongeldig
       32 - 10   ongeldig
    */

    if (winner > 25 && difference !== 2) {
        return false;
    }

    return true;
}


/* ==================================================
   FOUTMARKERING
   ================================================== */

function clearInvalidStyle(setNumber) {

    const home =
        document.getElementById(
            "set" + setNumber + "home"
        );

    const away =
        document.getElementById(
            "set" + setNumber + "away"
        );

    home.classList.remove("invalid");
    away.classList.remove("invalid");
}


/* ==================================================
   SET CONTROLEREN
   ================================================== */

function validateSet(setNumber) {

    const homeInput =
        document.getElementById(
            "set" + setNumber + "home"
        );

    const awayInput =
        document.getElementById(
            "set" + setNumber + "away"
        );

    const homeText =
        homeInput.value.trim();

    const awayText =
        awayInput.value.trim();


    /*
       Set 5 mag volledig leeg zijn.
    */

    if (
        setNumber === 5 &&
        homeText === "" &&
        awayText === ""
    ) {

        clearInvalidStyle(setNumber);

        return true;
    }


    /*
       Als slechts één kant is ingevuld,
       is de score ongeldig.
    */

    if (
        homeText === "" ||
        awayText === ""
    ) {

        homeInput.classList.add("invalid");
        awayInput.classList.add("invalid");

        setStatus(
            "❌ Set " +
            setNumber +
            ": beide scores invullen.",
            "error"
        );

        return false;
    }


    const home = Number(homeText);
    const away = Number(awayText);


    if (
        !isValidVolleyballScore(
            home,
            away
        )
    ) {

        homeInput.classList.add("invalid");
        awayInput.classList.add("invalid");

        setStatus(
            "❌ Ongeldige score in Set " +
            setNumber +
            ": " +
            home +
            " - " +
            away +
            ".",
            "error"
        );

        return false;
    }


    clearInvalidStyle(setNumber);

    return true;
}


/* ==================================================
   ALLE SETS CONTROLEREN
   ================================================== */

function validateAllScores() {

    let allValid = true;

    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        const valid = validateSet(i);

        if (!valid) {
            allValid = false;
        }
    }

    return allValid;
}


/* ==================================================
   NEDERLANDSE GETALLEN
   ================================================== */

const dutchNumbers = {

    "nul": 0,

    "een": 1,
    "één": 1,

    "twee": 2,
    "drie": 3,
    "vier": 4,
    "vijf": 5,
    "zes": 6,
    "zeven": 7,
    "acht": 8,
    "negen": 9,

    "tien": 10,
    "elf": 11,
    "twaalf": 12,
    "dertien": 13,
    "veertien": 14,
    "vijftien": 15,
    "zestien": 16,
    "zeventien": 17,
    "achttien": 18,
    "negentien": 19,

    "twintig": 20,

    "eenentwintig": 21,
    "tweeëntwintig": 22,
    "tweeentwintig": 22,
    "drieëntwintig": 23,
    "drieentwintig": 23,
    "vierentwintig": 24,
    "vijfentwintig": 25,
    "zesentwintig": 26,
    "zevenentwintig": 27,
    "achtentwintig": 28,
    "negenentwintig": 29,

    "dertig": 30,

    "eenendertig": 31,
    "tweeëndertig": 32,
    "tweeendertig": 32,
    "drieëndertig": 33,
    "drieendertig": 33,
    "vierendertig": 34,
    "vijfendertig": 35,
    "zesendertig": 36,
    "zevenendertig": 37,
    "achtendertig": 38,
    "negenendertig": 39,

    "veertig": 40
};


/* ==================================================
   SCORE UIT SPRAAK HALEN
   ================================================== */

function extractScore(text) {

    text = text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();

    // Leestekens uit spraakherkenning als scheiding behandelen.
    text = text.replace(/[.,;!?-]/g, " ").replace(/\s+/g, " ").trim();


    /*
       Eerst Nederlandse getalwoorden.
    */

    const words =
        text
            .replace(/[-,.;!?]/g, " ")
            .split(/\s+/)
            .filter(Boolean);


    const spokenNumbers = [];


    for (const word of words) {

        if (
            Object.prototype.hasOwnProperty.call(
                dutchNumbers,
                word
            )
        ) {

            spokenNumbers.push(
                dutchNumbers[word]
            );
        }
    }


    /*
       Bijvoorbeeld:
       "vijfentwintig eenentwintig"
    */

    if (
        spokenNumbers.length >= 2
    ) {

        const a = spokenNumbers[0];
        const b = spokenNumbers[1];

        if (
            isValidVolleyballScore(a, b)
        ) {

            return [a, b];
        }
    }


    /*
       Normale cijfers.
    */

    const matches =
        text.match(/\d+/g);


    if (
        matches &&
        matches.length >= 2
    ) {

        const a =
            parseInt(
                matches[0],
                10
            );

        const b =
            parseInt(
                matches[1],
                10
            );


        if (
            isValidVolleyballScore(a, b)
        ) {

            return [a, b];
        }
    }


    /*
       Browser kan bijvoorbeeld "25 21"
       als "2521" doorgeven.
    */

    const digitsOnly =
        text.replace(/\D/g, "");


    if (
        digitsOnly.length < 2
    ) {

        return [];
    }


    const candidates = [];


    for (
        let split = 1;
        split < digitsOnly.length;
        split++
    ) {

        const left =
            parseInt(
                digitsOnly.substring(
                    0,
                    split
                ),
                10
            );

        const right =
            parseInt(
                digitsOnly.substring(
                    split
                ),
                10
            );


        if (
            isValidVolleyballScore(
                left,
                right
            )
        ) {

            candidates.push(
                [left, right]
            );
        }
    }


    /*
       Alleen automatisch invullen wanneer
       er exact één mogelijke score is.
    */

    if (
        candidates.length === 1
    ) {

        return candidates[0];
    }


    return [];
}


/* ==================================================
   EINDSCORE BEREKENEN
   ================================================== */

function calculateScore() {

    let homeSets = 0;
    let awaySets = 0;


    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        const homeInput =
            document.getElementById(
                "set" + i + "home"
            );

        const awayInput =
            document.getElementById(
                "set" + i + "away"
            );


        const homeText =
            homeInput.value.trim();

        const awayText =
            awayInput.value.trim();


        if (
            homeText === "" ||
            awayText === ""
        ) {

            continue;
        }


        const home = Number(homeText);
        const away = Number(awayText);


        /*
           Ongeldige sets tellen niet mee.
        */

        if (
            !isValidVolleyballScore(
                home,
                away
            )
        ) {

            continue;
        }


        if (home > away) {

            homeSets++;

        } else if (away > home) {

            awaySets++;
        }
    }


    document.getElementById(
        "finalScore"
    ).textContent =
        homeSets +
        " - " +
        awaySets;
}


/* ==================================================
   HANDMATIG INVULLEN
   ================================================== */

document
    .querySelectorAll(
        'input[type="number"]'
    )
    .forEach(function(input) {

        input.addEventListener(
            "input",
            function() {

                const match =
                    input.id.match(
                        /^set(\d+)(home|away)$/
                    );


                if (match) {

                    const setNumber =
                        parseInt(
                            match[1],
                            10
                        );

                    clearInvalidStyle(
                        setNumber
                    );
                }


                calculateScore();
            }
        );


        input.addEventListener(
            "blur",
            function() {

                const match =
                    input.id.match(
                        /^set(\d+)(home|away)$/
                    );


                if (!match) {
                    return;
                }


                const setNumber =
                    parseInt(
                        match[1],
                        10
                    );


                const home =
                    document.getElementById(
                        "set" +
                        setNumber +
                        "home"
                    ).value.trim();


                const away =
                    document.getElementById(
                        "set" +
                        setNumber +
                        "away"
                    ).value.trim();


                /*
                   Nog niets ingevuld:
                   geen fout tonen.
                */

                if (
                    home === "" &&
                    away === ""
                ) {

                    clearInvalidStyle(
                        setNumber
                    );

                    return;
                }


                validateSet(setNumber);

                calculateScore();
            }
        );
    });


/* ==================================================
   E-MAIL VERSTUREN
   ================================================== */

function sendEmail() {

    const match =
        document.getElementById(
            "match"
        ).value.trim();


    if (
        match === ""
    ) {

        alert(
            "Vul eerst de wedstrijd in."
        );

        return;
    }


    /*
       Eerst alle scores controleren.
       Bij één ongeldige score wordt NIET
       verstuurd.
    */

    if (
        !validateAllScores()
    ) {

        return;
    }


    calculateScore();


    const finalScore =
        document.getElementById(
            "finalScore"
        ).textContent;


    let message =
        "Wedstrijd: " +
        match +
        "\n\n";


    message +=
        "Eindscore: " +
        finalScore +
        "\n\n";


    const substitute1 =
        document.getElementById("substitute1").value.trim();

    const substitute2 =
        document.getElementById("substitute2").value.trim();

    if (substitute1 !== "" || substitute2 !== "") {
        message += "Mogelijke wisselspelers:\n";

        if (substitute1 !== "") {
            message += "1. " + substitute1 + "\n";
        }

        if (substitute2 !== "") {
            message += "2. " + substitute2 + "\n";
        }

        message += "\n";
    }


    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        const home =
            document.getElementById(
                "set" + i + "home"
            ).value;


        const away =
            document.getElementById(
                "set" + i + "away"
            ).value;


        if (
            home !== "" ||
            away !== ""
        ) {

            message +=
                "Set " +
                i +
                ": " +
                home +
                " - " +
                away +
                "\n";
        }
    }


    const subject =
        "Volleybal uitslag - " +
        match;


const mailto =
    "mailto:" +
    "?subject=" +
    encodeURIComponent(subject) +
    "&body=" +
    encodeURIComponent(message);


    window.location.href =
        mailto;
}
